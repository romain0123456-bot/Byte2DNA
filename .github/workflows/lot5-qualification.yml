name: LOT5 qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lot5-qualification:
    runs-on: [self-hosted, Linux, X64, ovh-ci, "ci-control-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run actual qualification tests
        run: |
          python - <<'CHECK'
          import unittest
          suite = unittest.defaultTestLoader.discover('qualification/lot5/tests')
          if suite.countTestCases() < 4:
              raise SystemExit('At least four actual feature tests are required')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          CHECK
