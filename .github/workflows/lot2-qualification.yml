name: LOT2 qualification
on:
  pull_request:
    paths:
      - 'qualification/lot2/**'
      - '.github/workflows/lot2-qualification.yml'
permissions:
  contents: read
jobs:
  lot2-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run isolated LOT2 contract and decision-gate tests
        run: python -m unittest discover -s qualification/lot2/tests -v
